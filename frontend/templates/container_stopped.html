<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; background:#f4f4f4; padding:20px;">
  <div style="max-width:500px; margin:auto; background:white; border-radius:8px; padding:30px;">
    <h2 style="color:#C0392B;">⏹️ Container gestoppt</h2>
    <p>Deine Testumgebung wurde beendet.</p>
    <table style="width:100%; border-collapse:collapse; margin-top:16px;">
      <tr style="background:#fdf0f0;">
        <td style="padding:10px; font-weight:bold;">Name</td>
        <td style="padding:10px;">{{ container_name }}</td>
      </tr>
      <tr>
        <td style="padding:10px; font-weight:bold;">Grund</td>
        <td style="padding:10px;">{{ reason }}</td>
      </tr>
    </table>
    <p style="margin-top:24px; color:#888; font-size:12px;">
      Test-Buddy – On-Demand Testumgebungen auf Knopfdruck
    </p>
  </div>
</body>
</html>
